<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <linearGradient id="visorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
  </defs>
  <!-- Antenna -->
  <line x1="50" y1="26" x2="50" y2="14" stroke="#64748B" stroke-width="3" stroke-linecap="round" />
  <circle cx="50" cy="11" r="5" fill="#3B7D50" />
  <circle cx="48.5" cy="9.5" r="1.5" fill="#FFFFFF" opacity="0.8" />
  <!-- Body -->
  <rect x="20" y="24" width="60" height="64" rx="28" fill="url(#bodyGrad)" stroke="#64748B" stroke-width="2.5" />
  <!-- Visor -->
  <rect x="30" y="38" width="40" height="28" rx="12" fill="url(#visorGrad)" stroke="#334155" stroke-width="1.5" />
  <!-- Eyes -->
  <circle cx="39" cy="51" r="3.5" fill="#34D399" />
  <circle cx="40" cy="50" r="1" fill="#FFFFFF" />
  <circle cx="61" cy="51" r="3.5" fill="#34D399" />
  <circle cx="62" cy="50" r="1" fill="#FFFFFF" />
  <!-- Smile -->
  <path d="M 46 58 Q 50 61 54 58" stroke="#34D399" stroke-width="1.5" stroke-linecap="round" fill="none" />
